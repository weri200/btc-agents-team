name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Oldest Python the README supports, so newer-only syntax is caught.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest -v
      - run: |
          node test.cjs
          node test_market_ui.cjs
          node test_opinions.cjs
          for f in dist/*.js; do node --check "$f"; done
